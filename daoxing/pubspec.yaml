name: daoxing
description: "道行 - 基于运动的修仙游戏"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 健康数据
  health: ^11.1.1
  pedometer: ^4.2.0

  # 定位与天气
  geolocator: ^13.0.2
  http: ^1.2.2

  # 地图
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI 增强
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0

  # 工具
  intl: ^0.19.0
  permission_handler: ^11.4.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.4
  json_annotation: ^4.11.0
  freezed_annotation: ^2.4.4
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
